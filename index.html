<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NovaFlex CRM</title>
<meta name="description" content="NovaFlex — Inventory &amp; CRM">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#08080a">

<!-- PWA manifest — this + the service worker + HTTPS is what makes the
     browser offer "Install" on desktop and "Add to Home Screen" on mobile -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<!-- React, without a build step: Babel Standalone compiles the JSX in
     app.js in the browser at load time. Fine for an internal team tool
     with a handful of users; if this ever needs to serve real public
     traffic at scale, a proper build (Vite/Next) would load faster. -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  body { background: #09090b; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #18181b; }
  ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 4px; }

  /* ---- Shipping labels ----
     Labels are 4x6in, the standard thermal-printer size, and also print fine
     centered on Letter. When printing we hide the whole app and show only the
     label sheet, so the operator gets labels and nothing else — no nav, no
     table, no dark background eating a toner cartridge. */
  #labelSheet { display: none; }

  @media print {
    @page { size: 4in 6in; margin: 0; }
    html, body { background: #fff !important; margin: 0; padding: 0; }
    body > #root { display: none !important; }
    #labelSheet {
      display: block !important;
      position: static;
      background: #fff;
      color: #000;
    }
    .ship-label {
      width: 4in; height: 6in;
      padding: 0.28in 0.3in;
      box-sizing: border-box;
      page-break-after: always;
      break-after: page;
      display: flex; flex-direction: column;
      font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      color: #000;
    }
    .ship-label:last-child { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="labelSheet"></div>

  <!-- App configuration: the only thing you need to change per environment -->
  <script>
    window.NOVAFLEX_API_URL = "https://api.novaflexusa.com"; // deployed backend (Railway, custom domain)
  </script>

  <script type="text/babel" src="icons.js?v=12"></script>
  <script type="text/babel" src="app.js?v=12"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
